<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 292" width="900" height="292" role="img"><style>
.bg{fill:#ffffff}.ink{fill:#1f2328}.mut{fill:#59636e}.line{stroke:#d0d7de}.box{fill:#f6f8fa;stroke:#d0d7de}
.acc{fill:#b5532c}.accs{stroke:#b5532c}.acc2{fill:#2f6f73}.acc2s{stroke:#2f6f73}.soft{fill:#fbefe8}.soft2{fill:#e6f1f1}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:15px;font-weight:600}.s{font-size:12.5px}.xs{font-size:10.5px}.h{font-size:17px;font-weight:700}
@media (prefers-color-scheme:dark){.bg{fill:#0d1117}.ink{fill:#e6edf3}.mut{fill:#9198a1}.line{stroke:#30363d}.box{fill:#161b22;stroke:#30363d}.soft{fill:#2b1a12}.soft2{fill:#10292a}.acc{fill:#e07a4f}.accs{stroke:#e07a4f}.acc2{fill:#4fa3a8}.acc2s{stroke:#4fa3a8}}
</style>
<rect class="bg" width="900" height="292" rx="12"/><text x="40" y="44" class="h ink">Il testo e il canone hanno uno stato</text><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><rect x="40" y="80" width="170" height="70" rx="10" class="box" stroke-width="1" /><text x="125" y="110" text-anchor="middle" class="t ink">bozza</text><text x="125" y="132" text-anchor="middle" class="xs mut">prosa proposta</text><path d="M212 115 l24 0" class="line" stroke-width="2" marker-end="url(#a)"/><rect x="240" y="80" width="170" height="70" rx="10" class="box" stroke-width="1" /><text x="325" y="110" text-anchor="middle" class="t ink">revisionato</text><text x="325" y="132" text-anchor="middle" class="xs mut">interventi motivati</text><path d="M412 115 l24 0" class="line" stroke-width="2" marker-end="url(#a)"/><rect x="440" y="80" width="170" height="70" rx="10" class="soft" stroke-width="1" stroke="#b5532c"/><text x="525" y="110" text-anchor="middle" class="t ink">accettato</text><text x="525" y="132" text-anchor="middle" class="xs mut">approvato dall'autore, hash</text><text x="40" y="196" class="t ink">Tipi di informazione</text><rect x="40" y="212" width="152" height="56" rx="8" class="soft"/><text x="52" y="236" class="s ink" font-weight="600">canon</text><text x="52" y="256" class="xs mut">fatto approvato</text><rect x="206" y="212" width="152" height="56" rx="8" class="soft2"/><text x="218" y="236" class="s ink" font-weight="600">hypothesis</text><text x="218" y="256" class="xs mut">ancora da decidere</text><rect x="372" y="212" width="152" height="56" rx="8" class="soft2"/><text x="384" y="236" class="s ink" font-weight="600">belief</text><text x="384" y="256" class="xs mut">credenza di un personaggio</text><rect x="538" y="212" width="152" height="56" rx="8" class="soft2"/><text x="550" y="236" class="s ink" font-weight="600">knowledge</text><text x="550" y="256" class="xs mut">chi sa cosa, da quando</text><rect x="704" y="212" width="152" height="56" rx="8" class="soft2"/><text x="716" y="236" class="s ink" font-weight="600">rule</text><text x="716" y="256" class="xs mut">limite del mondo</text><text x="660" y="104" class="s mut">ogni revisione accettata</text><text x="660" y="122" class="s mut">è un file nuovo e immutabile;</text><text x="660" y="140" class="s mut">il canone si emenda, non si cancella</text></svg>