<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 256" width="900" height="256" role="img"><style>
.bg{fill:#ffffff}.ink{fill:#1f2328}.mut{fill:#59636e}.line{stroke:#d0d7de}.box{fill:#f6f8fa;stroke:#d0d7de}
.acc{fill:#b5532c}.accs{stroke:#b5532c}.acc2{fill:#2f6f73}.acc2s{stroke:#2f6f73}.soft{fill:#fbefe8}.soft2{fill:#e6f1f1}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.t{font-size:15px;font-weight:600}.s{font-size:12.5px}.xs{font-size:11px}.h{font-size:17px;font-weight:700}
@media (prefers-color-scheme:dark){.bg{fill:#0d1117}.ink{fill:#e6edf3}.mut{fill:#9198a1}.line{stroke:#30363d}.box{fill:#161b22;stroke:#30363d}.soft{fill:#2b1a12}.soft2{fill:#10292a}.acc{fill:#e07a4f}.accs{stroke:#e07a4f}.acc2{fill:#4fa3a8}.acc2s{stroke:#4fa3a8}}
</style>
<rect class="bg" width="900" height="256" rx="12"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><text x="40" y="44" class="h ink">Il ciclo editoriale</text><rect x="30" y="72" width="152" height="112" rx="10" class="box" stroke-width="1"/><circle cx="56" cy="98" r="13" class="acc"/><text x="56" y="103" text-anchor="middle" class="s" fill="#fff" font-weight="700">1</text><text x="44" y="138" class="t ink">Unità di lavoro</text><text x="44" y="162" class="xs mut">intenzione e contesto</text><path d="M184 128 l14 0" class="line" stroke-width="2" marker-end="url(#a)"/><rect x="202" y="72" width="152" height="112" rx="10" class="box" stroke-width="1"/><circle cx="228" cy="98" r="13" class="acc2"/><text x="228" y="103" text-anchor="middle" class="s" fill="#fff" font-weight="700">2</text><text x="216" y="138" class="t ink">Scheda invisibile</text><text x="216" y="162" class="xs mut">motore, POV, uscita</text><path d="M356 128 l14 0" class="line" stroke-width="2" marker-end="url(#a)"/><rect x="374" y="72" width="152" height="112" rx="10" class="box" stroke-width="1"/><circle cx="400" cy="98" r="13" class="acc"/><text x="400" y="103" text-anchor="middle" class="s" fill="#fff" font-weight="700">3</text><text x="388" y="138" class="t ink">Stesura</text><text x="388" y="162" class="xs mut">Carta, campioni, varianti</text><path d="M528 128 l14 0" class="line" stroke-width="2" marker-end="url(#a)"/><rect x="546" y="72" width="152" height="112" rx="10" class="box" stroke-width="1"/><circle cx="572" cy="98" r="13" class="acc2"/><text x="572" y="103" text-anchor="middle" class="s" fill="#fff" font-weight="700">4</text><text x="560" y="138" class="t ink">Tre letture</text><text x="560" y="162" class="xs mut">senso → voce → forma</text><path d="M700 128 l14 0" class="line" stroke-width="2" marker-end="url(#a)"/><rect x="718" y="72" width="152" height="112" rx="10" class="box" stroke-width="1"/><circle cx="744" cy="98" r="13" class="acc"/><text x="744" y="103" text-anchor="middle" class="s" fill="#fff" font-weight="700">5</text><text x="732" y="138" class="t ink">Consegna</text><text x="732" y="162" class="xs mut">bozza ≠ accettato</text><path d="M796 186 C796 230 106 230 106 186" fill="none" class="accs" stroke-width="1.5" stroke-dasharray="5 5"/><text x="450" y="236" text-anchor="middle" class="xs mut">la consegna aggiorna lo stato: la sessione successiva riparte dal cursore, non dalla memoria</text></svg>